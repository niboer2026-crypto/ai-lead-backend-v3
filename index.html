<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lead Master - 美业 CRM 后台</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--primary:#6366f1;--border:#e2e8f0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
    .container{max-width:1000px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05)}
    h2,h3{margin-top:0}
    input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:6px;box-sizing:border-box}
    button{background:var(--primary);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
    button:hover{opacity:.9}button.success{background:#10b981}
    .chat-box{height:300px;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-y:auto;background:#f8fafc;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
    .msg{padding:8px 12px;border-radius:8px;max-width:80%;font-size:13px}
    .msg.customer{background:#fff;border:1px solid var(--border);align-self:flex-start}
    .msg.ai{background:#6366f1;color:#fff;align-self:flex-end}
  </style>
</head>
<body>
  <div class="container">
    <h2>🚀 AI Lead Master & 美业 CRM 控制台（双引擎版）</h2>

    <!-- AI 配置与密钥设置 -->
    <div class="card">
      <h3>🔐 AI 引擎状态与设置</h3>
      <p id="aiStatus" style="font-size:14px;font-weight:bold;color:#4f46e5;margin-bottom:12px">状态：检查中...</p>
      
      <div style="margin-bottom:12px">
        <label style="font-size:13px;font-weight:600">Gemini API Key (支持多个逗号分隔)</label>
        <div style="display:flex;gap:10px">
          <input id="apiKeyInput" type="password" placeholder="粘贴 Gemini API Key">
          <button onclick="saveApiKey()" style="white-space:nowrap">保存 Key</button>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:15px">
        <button class="success" onclick="testKey()" style="white-space:nowrap">测试双引擎连接</button>
      </div>
      <p style="font-size:12px;color:#64748b;margin-top:8px">提示：当 Gemini 触发 429 额度超限时，系统会自动切换至豆包（Doubao-seed-2-1-turbo-260628）兜底回复。</p>
    </div>

    <!-- AI 助理对话测试 -->
    <div class="card">
      <h3>🤖 AI 美业客服助理实时测试</h3>
      <div class="chat-box" id="chatContainer">
        <div class="msg ai">👋 您好！我是 Beauty Corner 专属美业助理，请问有什么可以帮您的？</div>
      </div>
      <div style="display:flex;gap:10px">
        <input id="chatPhone" placeholder="客户手机号 (可选)" style="width:180px">
        <input id="chatMsg" placeholder="输入咨询内容 (例如: 你们店有什么美甲项目？)" onkeypress="if(event.key==='Enter')sendChat()">
        <button id="sendBtn" onclick="sendChat()" style="white-space:nowrap">发送</button>
      </div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch('/api/ai/status');
        const data = await res.json();
        document.getElementById('aiStatus').textContent = `当前引擎模式：${data.model} | 状态：${data.configured ? '已就绪 (Online)' : '未配置'}`;
      } catch (e) {
        document.getElementById('aiStatus').textContent = '状态：连接后端服务异常';
      }
    }

    async function saveApiKey() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      if (!apiKey) { alert('请输入 Key'); return; }
      const res = await fetch('/api/ai/key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey })
      });
      const data = await res.json();
      alert(data.message || data.error);
      loadStatus();
    }

    async function testKey() {
      const btn = event.target;
      btn.textContent = '测试中...';
      try {
        const res = await fetch('/api/ai/key-test', { method: 'POST' });
        const data = await res.json();
        alert(data.ok ? data.message : '连接失败: ' + data.error);
      } catch (err) {
        alert('请求出错: ' + err.message);
      } finally {
        btn.textContent = '测试双引擎连接';
      }
    }

    async function sendChat() {
      const phone = document.getElementById('chatPhone').value.trim();
      const message = document.getElementById('chatMsg').value.trim();
      if (!message) return;

      const box = document.getElementById('chatContainer');
      const sendBtn = document.getElementById('sendBtn');
      
      box.innerHTML += `<div class="msg customer">[${phone || 'Web'}] ${message}</div>`;
      document.getElementById('chatMsg').value = '';
      box.scrollTop = box.scrollHeight;

      sendBtn.textContent = '发送中...';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/ai/chat-reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer_phone: phone, customer_message: message })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          box.innerHTML += `<div class="msg ai">${data.ai_reply}</div>`;
        } else {
          box.innerHTML += `<div class="msg customer" style="background:#fee2e2; color:#b91c1c">错误: ${data.error || '未知错误'}</div>`;
        }
      } catch (err) {
        box.innerHTML += `<div class="msg customer" style="background:#fee2e2; color:#b91c1c">网络异常: ${err.message}</div>`;
      } finally {
        sendBtn.textContent = '发送';
        sendBtn.disabled = false;
        box.scrollTop = box.scrollHeight;
      }
    }

    loadStatus();
  </script>
</body>
</html>
