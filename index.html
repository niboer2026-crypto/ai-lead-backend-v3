<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI Lead Master - 社交平台定向搜索后台</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2, h3 { color: #007bff; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
    .card { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.primary { background: #007bff; color: #fff; }
    button.secondary { background: #6c757d; color: #fff; }
    button.danger { background: #dc3545; color: #fff; }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🚀 AI Lead Master - 跨境智能获客与社媒管理系统</h2>

    <!-- 社交平台定向搜索模块容器 -->
    <div class="card">
      <h3>🌐 多平台社交定向搜索与账号隔离任务</h3>
      
      <form id="socialSearchForm">
        <div class="form-group">
          <label>选择平台账号：</label>
          <select id="ssAccount" required>
            <option value="">请选择账号</option>
          </select>
        </div>

        <div class="form-group">
          <label>目标平台：</label>
          <input type="text" id="ssPlatform" readonly placeholder="自动匹配">
        </div>

        <div class="form-group">
          <label>国家 (Country)：</label>
          <input type="text" id="ssCountry" placeholder="例如: UAE">
        </div>

        <div class="form-group">
          <label>城市 (City)：</label>
          <input type="text" id="ssCity" placeholder="例如: Dubai">
        </div>

        <div class="form-group">
          <label>搜索关键词：</label>
          <input type="text" id="ssKeywords" placeholder="例如: Salon & Spa" required>
        </div>

        <div class="form-group">
          <label>性别筛选：</label>
          <select id="ssGender">
            <option value="不限">不限</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
          </select>
        </div>

        <div style="grid-column: 1 / -1;">
          <button type="submit" class="primary" style="width: 100%; padding: 12px;">保存并创建搜索任务</button>
        </div>
      </form>

      <h3 style="margin-top: 30px;">当前搜索任务列表</h3>
      <table>
        <thead>
          <tr>
            <th>平台</th>
            <th>账号ID</th>
            <th>国家</th>
            <th>城市</th>
            <th>关键词</th>
            <th>性别</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="socialSearchList">
          <!-- 动态加载 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 引入独立的前端业务脚本 -->
  <script src="/social-search.js"></script>
</body>
</html>
